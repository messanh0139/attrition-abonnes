# Passerelle HTTPS : seul composant joignable depuis l'extérieur (zone d'accès, 10.40.10.0/24).
# Elle chiffre les échanges, filtre les requêtes et transmet uniquement vers l'API de collecte.
worker_processes 1;
events { worker_connections 256; }

http {
    server_tokens off;                                   # la version de Nginx n'est pas révélée
    client_max_body_size 1m;                             # un lot d'événements reste petit
    limit_req_zone $binary_remote_addr zone=par_client:1m rate=10r/s;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    upstream api_collecte { server api_collecte:8000; }

    server {
        listen 443 ssl;
        server_name localhost passerelle;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_protocols TLSv1.3;                           # TLS 1.3 uniquement
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000" always;   # HTTPS imposé au navigateur
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'" always;

        # Seuls les deux points d'accès de l'API sont exposés ; tout le reste est refusé
        location = /sante { proxy_pass http://api_collecte; }
        location = /evenements {
            limit_req zone=par_client burst=20 nodelay;
            limit_except POST { deny all; }
            proxy_pass http://api_collecte;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
        location / { return 404; }
    }
}
